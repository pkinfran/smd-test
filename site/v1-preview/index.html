<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1c3042">
<title>街角数码铺 · UI V1 交互预览</title>
<style>
:root{font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif;color:#3e3327;background:#141b25}*{box-sizing:border-box}html,body{margin:0;min-height:100%;overflow-x:hidden}button{font:inherit;cursor:pointer;touch-action:manipulation}button:disabled{cursor:not-allowed;opacity:.52}button:focus-visible{outline:3px solid #fff0a1;outline-offset:2px}
#app{position:relative;isolation:isolate;width:100%;max-width:480px;height:100svh;min-height:545px;margin:0 auto;overflow:hidden;background:#bc9c72;box-shadow:0 0 70px #0008}
.view,.sceneImage{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;user-select:none;-webkit-user-drag:none}
.cover{position:absolute;inset:0;background:linear-gradient(180deg,transparent 47%,#181d2a10 67%,#0e152bb5 100%);pointer-events:none}
.menuBrand{position:absolute;top:2%;left:0;right:0;text-align:center;pointer-events:none}
.menuBtn{position:absolute;top:78%;left:11%;width:78%;height:8.5%;border:3px solid #fff3af;border-radius:24px;background:linear-gradient(180deg,#ffeeb2,#ffcf57 41%,#e48622);color:#592900;font-weight:1000;font-size:clamp(20px,5.3vw,28px);text-shadow:0 2px #fff6cf;box-shadow:0 4px 0 #964d16,inset 0 2px #fffdd6,0 0 15px #ffcf67a1;z-index:2;animation:breath 2.5s ease-in-out infinite}
.menuMore{position:absolute;top:90.6%;left:7%;right:7%;display:flex;gap:8px;z-index:2}
.menuMore button{flex:1;min-height:43px;max-height:56px;color:#fff0cf;background:#1d3043f2;border:1px solid #d6ba8c;border-radius:11px;font-size:12px;font-weight:750;box-shadow:0 3px #121c2c}
.menuMore button:disabled{border-style:dashed}
.hud{height:69px;position:absolute;top:0;left:0;right:0;z-index:6;background:linear-gradient(180deg,#2f4558,#192737);border-bottom:3px solid #c49c65;display:grid;grid-template-columns:1.13fr 1fr .85fr auto;gap:4px;padding:7px 6px 5px;box-shadow:0 4px 13px #1b20229c}
.hudTile{display:flex;flex-direction:column;justify-content:center;align-items:center;min-width:0;border-radius:8px;border:1px solid #a38860;background:linear-gradient(#142b3b,#1d3040);color:#fff4db;line-height:1.12}.hudTile span{font-size:10px;color:#ffd38e}.hudTile strong{font-size:clamp(11px,3vw,14px);font-weight:850;margin-top:5px;white-space:nowrap;letter-spacing:-.2px}.hudTile.date{background:#fff0c8;color:#864729;border-color:#ebbd67}.hudTile.date span{color:#aa5b34}.hudTile.date strong{color:#a35231}.menuSmall{width:38px;border-radius:8px;border:1px solid #c29c60;color:#f7dfaa;background:#162b3d;font-size:22px}
.scene{position:absolute;inset:69px 0 81px;overflow:hidden;background:#ae8764}.sceneImage{z-index:0;display:block}.sceneShade{position:absolute;inset:0;background:linear-gradient(180deg,#172e38af,transparent 18%,transparent 72%,#15212d57);pointer-events:none;z-index:1}.sceneTag{position:absolute;z-index:2;top:10px;left:12px;border:1px solid #fbe0a0;border-radius:7px;background:#1a3547e7;padding:7px 10px;color:#ffe5b0;font-weight:850;font-size:11px}
.spot{position:absolute;z-index:3;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:49px;min-height:49px;transform:translate(-50%,-50%);background:transparent;color:#fff0cf;border:0;padding:1px;filter:drop-shadow(0 3px 5px #1c1718b0)}.spot .circle{display:grid;place-items:center;width:31px;height:31px;border-radius:50%;border:3px solid #fff1a9;background:#e0a03a;color:#6a3c11;font-size:14px;font-weight:950;animation:breath 2.8s infinite}.spot .title{background:#193447f2;border:1px solid #f3d091;border-radius:6px;font-size:10px;line-height:1;padding:4px 6px;white-space:nowrap;font-weight:850}.spot.active .circle{background:#fff8c9;box-shadow:0 0 0 7px #f2c7737c;animation:none}
.spot[data-spot=customer]{left:20%;top:46%}.spot[data-spot=shelf]{left:54%;top:14%}.spot[data-spot=repair]{left:83%;top:36%}.spot[data-spot=device]{left:79%;top:83%}
.nav{height:81px;position:absolute;bottom:0;left:0;right:0;z-index:7;display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom);background:linear-gradient(#2e4b60,#1b3145);border-top:4px solid #d4b17a;box-shadow:0 -6px 18px #1b1a1c80}.nav button{min-width:0;background:transparent;border:0;color:#fff0dc;font-weight:850;font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}.nav button .glyph{font-size:23px;line-height:1.1}.nav button.active{background:linear-gradient(#426677,#284b66);color:#ffe5ac;box-shadow:inset 0 4px #f5d182,0 0 10px #91f5ef69}.nav button:disabled{opacity:.48}
.toast{position:absolute;z-index:10;left:15px;right:15px;bottom:89px;pointer-events:none;min-height:29px;padding:7px 10px;border:1px solid #e6b675;border-radius:7px;background:#152b3eea;color:#fff1d7;text-align:center;font-weight:700;font-size:11px;line-height:1.45;max-height:55px;overflow:hidden}
.dialog{position:absolute;z-index:9;left:10px;right:10px;bottom:94px;min-height:152px;display:flex;gap:10px;align-items:flex-start;padding:17px 45px 16px 15px;background:linear-gradient(#264459f9,#1b3145f9);color:#fff4d5;border:3px solid #f5cf85;border-radius:16px;box-shadow:0 4px 0 #6b492e,0 10px 25px #0d2037ad;animation:rise .18s ease-out}.dialogIcon{display:grid;place-items:center;flex:0 0 45px;height:48px;background:#e6af61;border:2px solid #fff1bb;border-radius:10px;color:#6b451e;font-size:23px;font-weight:900}.dialog strong{display:block;font-size:16px}.dialog small{display:block;color:#edcc95;font-size:11px;margin:5px 0}.dialog p{font-size:11px;line-height:1.55;margin:6px 0 0}.dialog button{position:absolute;right:7px;top:8px;background:#995b37;color:#fff;border:1px solid #e0af80;border-radius:8px;width:32px;height:32px;font-size:22px}
.overview{position:absolute;inset:69px 0 81px;overflow-y:auto;overflow-x:hidden;background:#dbc29c}.overviewArt{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:blur(5px);opacity:.7;transform:scale(1.05)}.overview::before{content:'';position:absolute;z-index:1;inset:0;background:#e8d8b7b8}.overviewContent{position:relative;z-index:2;min-height:100%;padding:13px 13px 19px}.bookTop{display:flex;align-items:center;justify-content:center;gap:10px;text-align:center;color:#463c35;font-size:20px;font-weight:1000;padding:4px 0 10px;text-shadow:0 1px #fff1d2}.book{border-radius:7px 13px 13px 7px;padding:15px 14px 14px 23px;border:3px solid #9c7950;background:repeating-linear-gradient(#fff3d7 0 33px,#d7bc8f55 33px 34px);box-shadow:6px 7px 0 #594c3799,inset 6px 0 #ddbd81;position:relative}.book:before{content:'';position:absolute;left:8px;top:10px;bottom:10px;width:3px;border-radius:7px;background:repeating-linear-gradient(#876744 0 8px,transparent 8px 25px)}.book h2{margin:4px 0 6px;font-size:17px;color:#794927}.book .sub{font-size:11px;color:#816d57;margin-bottom:10px}.bookMetrics{display:grid;grid-template-columns:1fr 1fr;gap:8px}.bm{padding:10px 10px;border-radius:7px;background:#f0dfbb;border:1px solid #b5986d}.bm span{font-size:10px;color:#705940}.bm b{display:block;font-size:22px;color:#22624f;margin-top:6px}.progress{margin-top:12px;border:1px solid #ddaf71;border-radius:6px;background:#fcecd0;padding:11px}.progress b{font-size:12px}.track{height:10px;background:#a29a8d;border-radius:99px;margin-top:8px;overflow:hidden}.fill{width:0;background:#f0ad42;height:100%;border-radius:99px}.book h3{margin:14px 0 8px;font-size:14px;color:#865034}.tasks{display:grid;gap:6px}.task{display:flex;align-items:center;gap:7px;background:#f4e3c4;border:1px solid #dcc49d;border-radius:6px;padding:8px 10px;color:#654c3d;font-size:11px}.task i{font-style:normal;font-size:17px}.task.disabled{color:#a6947d}.foot{margin:12px 2px;font-size:10px;color:#705e50;line-height:1.5}.backShop{width:100%;margin-top:12px;padding:11px;border:2px solid #e3b673;border-radius:9px;background:linear-gradient(#33556d,#1e3448);color:#ffe1a9;font-weight:850;min-height:45px}
@keyframes rise{from{transform:translateY(10px);opacity:0}to{transform:translateY(0);opacity:1}}@keyframes breath{0%,100%{box-shadow:0 0 0 2px #ffdc823d}50%{box-shadow:0 0 0 7px #ffdc8226}}
@media(max-width:355px){.hud{height:62px}.scene,.overview{top:62px}.sceneTag{top:5px;font-size:10px}.nav{height:72px}.scene,.overview{bottom:72px}.menuBtn{font-size:18px}.dialog{bottom:80px}.toast{bottom:79px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body><div id="app" role="application" aria-label="街角数码铺游戏视觉预览"></div>
<script>
const state={screen:'menu',scene:'shop',selected:null,fixture:0,info:false,events:0};
const cases=[{cash:1288,repute:62,date:'2003-06-18'},{cash:0,repute:62,date:'2003-06-19'},{cash:68,repute:0,date:'2003-06-20'}];
const points=[{id:'customer',label:'接待',icon:'人',title:'有客人上门了',sub:'玻璃柜台 · 旧手机咨询',hint:'点按顾客会弹出真实的交互面板。人物行走、性格与议价将由 S1-U09 等后续单元接入。'},{id:'shelf',label:'货架',icon:'货',title:'旧手机展示货架',sub:'2003 年 · 功能手机与配件',hint:'货架是可点击的独立操作位，真实商品数量与库存操作目前尚未接入。'},{id:'repair',label:'维修',icon:'修',title:'手机维修工作台',sub:'电烙铁与老式维修设备',hint:'这里未来会接入故障分析、维修选项和配件成本。'},{id:'device',label:'查看',icon:'机',title:'柜台二手机',sub:'手机样机 · 等待检测',hint:'后续验机将有屏幕、外观、电池等状态及可验证的判断。'}];
const app=document.getElementById('app');
const fmtMoney=v=>new Intl.NumberFormat('zh-CN',{style:'currency',currency:'CNY',maximumFractionDigits:0}).format(v);
const fmtDate=v=>v.split('-').join('.');
const info=()=>{state.info=true;render()};const start=()=>{state.screen='playing';state.scene='shop';state.selected=null;render()};
const nav=id=>{if(['trade','people'].includes(id))return;state.selected=null;state.scene=id;state.events++;render()};
const select=id=>{state.selected=id;state.events++;render()};
const close=()=>{state.selected=null;state.info=false;render()};
const menu=()=>{state.screen='menu';state.selected=null;render()};
const data=()=>cases[state.fixture];
function html(t){return t.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')}
function navHTML(){const items=[['shop','🏪','店铺'],['trade','🤝','交易'],['dashboard','📊','总览'],['people','👤','人物']];return '<nav class="nav" aria-label="游戏场景导航">'+items.map(([id,emoji,label])=>`<button type="button" data-scene="${id}" aria-current="${state.scene===id?'page':'false'}" class="${state.scene===id?'active':''}" ${['trade','people'].includes(id)?'disabled title="模块尚未开放"':''}><span class="glyph" aria-hidden="true">${emoji}</span>${label}</button>`).join('')+'</nav>'}
function hudHTML(){return `<header class="hud" aria-label="游戏经营 HUD"><div class="hudTile date"><span>日期</span><strong>${fmtDate(data().date)}</strong></div><div class="hudTile"><span>现金</span><strong>${fmtMoney(data().cash)}</strong></div><div class="hudTile"><span>信誉</span><strong>★ ${data().repute}</strong></div><button type="button" class="menuSmall" data-action="menu" aria-label="返回主菜单">☰</button></header>`}
function menuHTML(){return `<main class="view"><img class="view" src="assets/menu.webp" alt="2003年街角数码店店外场景，店铺招牌、旧手机陈列和自行车"><div class="cover"></div><button class="menuBtn" data-action="start" aria-label="开始营业">开始营业 ❯</button><div class="menuMore"><button data-action="info">游戏说明</button><button disabled title="存档系统尚未开放">继续存档</button></div></main>`}
function shopHTML(){return `<section class="scene" data-testid="shop-world" aria-label="2003年店铺场景"><img class="sceneImage" src="assets/shop.webp" alt="街角数码铺室内的旧手机柜台、顾客、货架、维修桌与CRT显示器"><div class="sceneShade"></div><div class="sceneTag">第一章 · 开张日</div>${points.map(x=>`<button type="button" class="spot ${state.selected===x.id?'active':''}" data-spot="${x.id}" aria-label="查看${x.label}" aria-pressed="${state.selected===x.id?'true':'false'}"><span class="circle">${x.icon}</span><span class="title">${x.label}</span></button>`).join('')}</section>`}
function overviewHTML(){return `<section class="overview" data-testid="overview-world"><img class="overviewArt" alt="" src="assets/overview.webp"><div class="overviewContent"><div class="bookTop">▤ · 街角数码铺经营账本</div><div class="book"><h2>店铺经营总览</h2><div class="sub">第一章 · ${fmtDate(data().date)} · 测试快照</div><div class="bookMetrics"><div class="bm"><span>当前现金</span><b>${fmtMoney(data().cash)}</b></div><div class="bm"><span>街坊信誉</span><b>★ ${data().repute}</b></div></div><div class="progress"><b>经营阶段 · 刚刚开张</b><div class="track"><div class="fill"></div></div></div><h3>店铺今日目标</h3><div class="tasks"><div class="task"><i>📍</i>熟悉店内的四处互动点</div><div class="task disabled"><i>▢</i>真实设备鉴定 · 后续开放</div><div class="task disabled"><i>▢</i>真实库存与每日结算 · 后续开放</div></div><h3>待开放经营模块</h3><div class="tasks"><div class="task disabled">▣ 库存管理 / 维修进度</div><div class="task disabled">↗ 店铺升级 / 员工发展</div></div><p class="foot">此页显示的是固定测试数据。概念图里的收入、销量、任务、顾客与库存不代表真实存档。</p></div><button class="backShop" data-action="backShop">← 回到店铺</button></div></section>`}
function dialogueHTML(){let item=points.find(p=>p.id===state.selected);if(!item)return '';return `<aside class="dialog" data-testid="scene-detail" aria-live="polite"><span class="dialogIcon">${item.icon}</span><div><strong>${item.title}</strong><small>${item.sub}</small><p>${item.hint}</p></div><button data-action="close" aria-label="关闭说明">×</button></aside>`}
function infoHTML(){return `<aside class="dialog" style="bottom:13%"><span class="dialogIcon">?</span><div><strong>游戏视觉交互预览</strong><small>概念图 V1 / S1-U08</small><p>在店铺点击顾客、货架、维修台和手机位置；切换总览可查看独立经营账本。目前没有真实交易、存档或经济模拟。</p></div><button data-action="close" aria-label="关闭说明">×</button></aside>`}
function render(){let body='';if(state.screen==='menu')body=menuHTML()+(state.info?infoHTML():'');else body=hudHTML()+(state.scene==='shop'?shopHTML():overviewHTML())+navHTML()+(state.selected?dialogueHTML():'')+`<div class="toast" data-testid="action-feedback">${state.selected?'已选择场景交互点':'界面预览 · 经营逻辑仍待后续 Unit 接入'}</div>`;app.innerHTML=body;}
app.addEventListener('click',e=>{const button=e.target.closest('button');if(!button||button.disabled)return;const id=button.dataset.spot;if(id){select(id);return}const scene=button.dataset.scene;if(scene){nav(scene);return}const action=button.dataset.action;if(action==='start')start();else if(action==='menu')menu();else if(action==='backShop')nav('shop');else if(action==='close')close();else if(action==='info')info()});
window.addEventListener('keydown',e=>{if(e.key==='Escape'||e.key==='Backspace'){if(state.selected||state.info)close();else if(state.screen==='playing')menu()}});
window.__smdV1={setFixture(n){if(Number.isInteger(n)&&n>=0&&n<cases.length){state.fixture=n;state.selected=null;render()}},snapshot(){return {...state,...data()}}};
render();
</script></body></html>
