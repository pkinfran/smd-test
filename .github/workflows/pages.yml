name: Deploy SMD H5 to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/prepare-site.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Private taptap_gpt branch/commit to build (leave blank for configured default)"
        required: false
        type: string
  schedule:
    - cron: '17,47 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.built-source.outputs.sha }}
    timeout-minutes: 15
    env:
      SOURCE_TOKEN: ${{ secrets.TAPTAP_SOURCE_TOKEN }}
      SOURCE_REF: ${{ inputs.source_ref || vars.SMD_TEST_SOURCE_REF || 'integration/S1-U08-app-shell-route' }}
    steps:
      - name: Checkout public hosting repository
        uses: actions/checkout@v4
      - name: Checkout private game source if read-only token exists
        if: env.SOURCE_TOKEN != ''
        uses: actions/checkout@v4
        with:
          repository: pkinfran/taptap_gpt
          ref: ${{ env.SOURCE_REF }}
          token: ${{ secrets.TAPTAP_SOURCE_TOKEN }}
          path: private-source
          persist-credentials: false
      - name: Setup pnpm and Node for real game build
        if: env.SOURCE_TOKEN != ''
        uses: pnpm/setup@v3
        with:
          runtime: node@24
      - name: Build only real static H5 assets, never private source
        if: env.SOURCE_TOKEN != ''
        run: |
          cd private-source
          pnpm install --frozen-lockfile
          pnpm exec vite build games/secondhand-digital-store/client --config games/secondhand-digital-store/client/vite.config.ts --base=/smd-test/
          cd ..
          node scripts/prepare-site.mjs private-source/games/secondhand-digital-store/client/dist site private-source
      - name: Check deploy payload and source revision
        shell: bash
        run: |
          test -f site/index.html
          test -f site/lab/S1-U08/index.html
          test -f site/revision.json
          test -f site/.nojekyll
          node -e 'const x = require("./site/revision.json"); if(x.base!=="/smd-test/")process.exit(1);console.log("Hosted build:",x)'
          if [ -z "$SOURCE_TOKEN" ]; then echo "::notice::No private read token; deploying the last committed static build in site/"; fi
      - name: Declare exact deployed upstream commit
        id: built-source
        run: echo "sha=$(node -p 'require("./site/revision.json").commit')" >> "$GITHUB_OUTPUT"
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static-only Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  browser-smoke:
    runs-on: ubuntu-latest
    needs: [build, deploy]
    env:
      EXPECTED_SHA: ${{ needs.build.outputs.source_sha }}
    timeout-minutes: 15
    steps:
      - name: Install real Chromium
        run: |
          mkdir -p /tmp/smd-chromium /tmp/smd-shots
          cd /tmp/smd-chromium
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Test public Pages URL and real touch navigation
        run: |
          cd /tmp/smd-chromium
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          const origin = 'https://pkinfran.github.io/smd-test';
          const expected = process.env.EXPECTED_SHA;
          if (!/^[a-f0-9]{40}$/.test(expected)) throw Error('No source SHA in build output');
          const browser = await chromium.launch();
          try {
            for(const width of [320,375,390]) {
              const page = await browser.newPage({ viewport:{width,height:844},isMobile:true,hasTouch:true });
              const errors = []; page.on('pageerror', error => errors.push(error.message));
              let response, liveRevision = '';
              for(let attempt=0;attempt<30;attempt++) {
                try {
                  const published = await page.request.get(origin+'/revision.json?source='+expected.slice(0,10),{timeout:20000});
                  if(published.ok())liveRevision=(await published.json()).commit;
                  response=await page.goto(origin+'/lab/S1-U08/', {waitUntil:'networkidle',timeout:20000});
                  const banner=await page.locator('.s108-meta').innerText({timeout:3000});
                  if(response?.status()===200 && liveRevision===expected && banner.includes(expected.slice(0,7)))break;
                  console.log('Waiting for Pages published SHA:',liveRevision,'expected',expected.slice(0,7));
                } catch(e) { console.log('Pages propagation pending',attempt,String(e)); }
                await page.waitForTimeout(4000);
              }
              if(response?.status()!==200) throw Error('Pages deep-link status '+response?.status());
              if(liveRevision!==expected) throw Error('Wrong deployed source SHA: '+liveRevision+' vs '+expected);
              if(!(await page.locator('.s108-meta').innerText()).includes(expected.slice(0,7)))throw Error('Wrong displayed SHA');
              if(await page.locator('.sd-menu-art svg').count()!==1)throw Error('Full storefront illustration missing');
              await page.screenshot({path:'/tmp/smd-shots/menu-'+width+'.png',fullPage:true});
              await page.locator('[data-testid="start-game"]').tap();
              if(!(await page.locator('.sd-hud').innerText()).includes('1,288'))throw Error('HUD wrong');
              if(await page.locator('.sd-world-art svg').count()!==1)throw Error('Game shop scene illustration missing');
              const sceneShapes=await page.locator('.sd-world-art svg path, .sd-world-art svg rect, .sd-world-art svg ellipse, .sd-world-art svg circle').count();
              if(sceneShapes<65)throw Error('Not a genuine illustrated store: only '+sceneShapes+' SVG shapes');
              if(await page.locator('[data-scene="shop"]').getAttribute('aria-current')!=='page')throw Error('Start did not enter actual shop scene');
              await page.screenshot({path:'/tmp/smd-shots/shop-'+width+'.png',fullPage:true});
              for(const id of ['customer','counter','shelf','bench']){
                const spot=page.locator('[data-testid="scene-hotspot-'+id+'"]');
                await spot.tap();
                if(await spot.getAttribute('aria-pressed')!=='true')throw Error('Shop object not selected: '+id);
                await page.locator('[data-testid="scene-detail"]').waitFor({state:'visible',timeout:5000});
                if(id==='customer')await page.screenshot({path:'/tmp/smd-shots/detail-'+width+'.png',fullPage:true});
                await page.locator('[data-testid="scene-detail-close"]').tap();
                if(await page.locator('[data-testid="scene-detail"]').count())throw Error('Scene detail did not close: '+id);
              }
              if(!(await page.locator('[data-scene="trade"]').isDisabled()))throw Error('Unimplemented trade cannot be enabled');
              if(!(await page.locator('[data-scene="people"]').isDisabled()))throw Error('Unimplemented people cannot be enabled');
              await page.locator('[data-testid="open-shop-card"]').tap();
              await page.locator('[data-scene="dashboard"]').tap();
              await page.locator('[data-testid="overview-world"]').waitFor({state:'visible',timeout:5000});
              if(await page.locator('[data-testid="shop-world"]').count()) throw Error('Overview reused shop instead of a distinct screen');
              if(!(await page.locator('[data-testid="overview-world"]').innerText()).includes('我的经营账本'))throw Error('Overview ledger content missing');
              if(await page.locator('[data-scene="dashboard"]').getAttribute('aria-current')!=='page')throw Error('Overview not selected');
              await page.screenshot({path:'/tmp/smd-shots/overview-'+width+'.png',fullPage:true});
              await page.locator('[data-testid="overview-back-shop"]').tap();
              await page.locator('[data-testid="shop-world"]').waitFor({state:'visible',timeout:5000});
              if(await page.locator('[data-testid="overview-world"]').count())throw Error('Overview did not close after return');
              await page.locator('[data-scene="dashboard"]').tap();
              if(await page.locator('[data-testid="overview-world"]').count()!==1)throw Error('Overview repeat navigation failed');
              await page.locator('[data-testid="back-menu"]').tap();
              await page.locator('[data-testid="s108-reset"]').tap();
              await page.locator('.s108-back').tap();
              await page.waitForURL(url => new URL(url).pathname.replace(/\/$/,'')==='/smd-test/lab',{timeout:15000});
              await page.locator(".unit-stack").first().waitFor({ state: "visible", timeout: 15000 });
              console.log("Returned to Visual Lab", page.url());
              await page.locator('[data-unit-id="S0-U03"]').tap();
              await page.locator('[data-testid="taptap-scenario"]').waitFor({state:"visible",timeout:15000});
              const overflow=await page.evaluate(()=>document.documentElement.scrollWidth-innerWidth);
              if(overflow>2)throw Error('Overflow '+overflow);
              if(errors.length)throw Error('Page JS exceptions '+errors.join('; '));
              await page.screenshot({path:'/tmp/smd-shots/pages-'+width+'.png',fullPage:true});
              console.log('PASS GitHub Pages '+width+'px: storefront+shop SVG, four hotspots+detail, distinct ledger+return, HUD, locked, deep-link+return, no JS/overflow');
              await page.close();
            }
          } finally { await browser.close(); }
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: github-pages-mobile-320-375-390
          path: /tmp/smd-shots/*.png
          if-no-files-found: ignore
